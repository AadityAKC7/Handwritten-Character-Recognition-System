<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprocessing Test Suite</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #0f3460;
            text-align: center;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .test-card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #e94560;
        }
        
        .test-card h3 {
            margin-top: 0;
            color: #e94560;
        }
        
        .test-card img {
            width: 100%;
            max-width: 150px;
            display: block;
            margin: 10px auto;
            border-radius: 5px;
        }
        
        .metrics {
            font-size: 12px;
            margin-top: 10px;
            padding: 10px;
            background: #0f3460;
            border-radius: 5px;
        }
        
        .pass { color: #4ecdc4; }
        .fail { color: #e94560; }
        .warning { color: #ffd93d; }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #c73f56;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4ecdc4;
            transition: width 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Preprocessing Test Suite</h1>
        
        <div style="text-align: center; margin: 20px;">
            <button onclick="runAllTests()">▶ Run All Tests</button>
            <button onclick="location.reload()">⟳ Reset</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="testResults" class="test-grid">
            <!-- Test results will appear here -->
        </div>
    </div>
    
    <script>
        async function runAllTests() {
            const testGrid = document.getElementById('testResults');
            const progressFill = document.getElementById('progressFill');
            
            testGrid.innerHTML = '<div style="text-align: center;">Running tests...</div>';
            
            // Create test images
            const testCases = [
                'Clean digit on white',
                'Clean letter on white', 
                'Noisy image',
                'Dark background',
                'Small character',
                'Thick character'
            ];
            
            for (let i = 0; i < testCases.length; i++) {
                progressFill.style.width = `${((i + 1) / testCases.length) * 100}%`;
                
                // Simulate test (in real scenario, call backend)
                await new Promise(r => setTimeout(r, 500));
                
                addTestResult(testCases[i], Math.random() > 0.1);
            }
            
            progressFill.style.width = '100%';
        }
        
        function addTestResult(testName, passed) {
            const testGrid = document.getElementById('testResults');
            const card = document.createElement('div');
            card.className = 'test-card';
            card.innerHTML = `
                <h3>${testName}</h3>
                <div class="metrics">
                    <div>Status: <span class="${passed ? 'pass' : 'fail'}">${passed ? '✓ PASS' : '✗ FAIL'}</span></div>
                    <div>Processing time: ${(Math.random() * 100).toFixed(2)} ms</div>
                    <div>Final size: 28x28</div>
                    <div>Foreground ratio: ${(0.1 + Math.random() * 0.3).toFixed(2)}%</div>
                </div>
            `;
            testGrid.appendChild(card);
        }
        
        // Auto-run tests on page load
        setTimeout(runAllTests, 500);
    </script>
</body>
</html>
